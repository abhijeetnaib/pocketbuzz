# Render.com Deployment Configuration
# https://render.com

services:
  - type: web
    name: pocketbuzz-api
    runtime: python
    repo: https://github.com/abhijeetnaib/pocketbuzz
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: SECRET_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
